# `cargo deny check`: advisories, licences (all compatible with GPL-3.0-or-later), bans and sources.
[advisories]
ignore = [
  # Only through gtk 0.18 (tauri's Linux stack): proc macros at build time, not in the Windows or macOS
  # builds SKEPI ships. No fixed release; tauri has to move off gtk 0.18. docs/threat-model.md.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, build-time macro of tauri's Linux gtk stack; not shipped" },
  # SQLite < 3.54.0 with a crafted -wal sibling. Our build is bundled-sqlcipher; libsqlite3-sys 0.39.x
  # (the "fixed" range) still bundles SQLite 3.53.4 there (sqlcipher-src =419.0.6), so upgrading would
  # only silence this check. Drop once libsqlite3-sys bundles sqlcipher-src 420 (SQLite 3.54.1).
  # docs/threat-model.md, "Dependency risk acceptance".
  { id = "RUSTSEC-2026-0459", reason = "no SQLCipher build with SQLite 3.54 in libsqlite3-sys yet; app-private databases only" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
