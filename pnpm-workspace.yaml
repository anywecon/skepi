packages:
  - 'apps/*'
  - 'packages/*'
  - 'modules/*'
  - 'tools/*'

# React Native native autolinking is more reliable with a flat node_modules.
nodeLinker: hoisted

# tools/rag-eval runs llama.cpp on CPU only: skip node-llama-cpp's GPU binary packages (hundreds of MB).
ignoredOptionalDependencies:
  - '@node-llama-cpp/win-x64-cuda'
  - '@node-llama-cpp/win-x64-cuda-ext'
  - '@node-llama-cpp/win-x64-vulkan'
  - '@node-llama-cpp/linux-x64-cuda'
  - '@node-llama-cpp/linux-x64-cuda-ext'
  - '@node-llama-cpp/linux-x64-vulkan'

# Supply-chain guard (docs/release-process.md, §4 "Dependency release age"): pnpm resolves no version that was
# published less than 7 days (10080 minutes) ago, transitive ones included. Exceptions go in
# minimumReleaseAgeExclude, by exact version (`name@version`), each with the date and the reason, and only
# on the maintainer's explicit decision (an urgent security fix); remove the entry once it is 7 days old.
minimumReleaseAge: 10080

# Security overrides, scoped to the one consumer of each package (docs/threat-model.md, "Dependency risk acceptance").
overrides:
  '@expo/cli>node-forge': 1.4.1
  '@expo/code-signing-certificates>node-forge': 1.4.1
  'eslint-plugin-react-hooks>zod': ^4.6.6
  'node-llama-cpp>simple-git': ^4.0.1
  'simple-git>@simple-git/argv-parser': ^2.0.1
