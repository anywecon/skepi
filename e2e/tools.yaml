# Tools (release build, airplane mode): GNSS fix (location permission granted by run-e2e.ps1; the first
# fix without A-GPS can take minutes) and the "Send by SMS" button, which is checked but never tapped: no
# step may open another app (run-e2e.ps1 fails the run on any hand-off tap or intent); then the SOS torch,
# red screen SOS and compass. Indoors, run-e2e.ps1
# -MockLocation runs this flow on the debug build with its debug-only mock provider (a fixed fix, no shell
# test provider; deterministic). The location steps come first: on the S23, shell test-provider positions
# (-SimulateGnss, release builds) stopped arriving once the torch had been switched on.
appId: ${APP_ID}
name: SKEPI tools (offline)
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- tapOn:
    id: tab-tools
- extendedWaitUntil:
    visible:
      id: tools-screen
    timeout: 10000
# Location: one fix on tap
- scrollUntilVisible:
    element:
      id: location-locate
    direction: DOWN
    timeout: 10000
- tapOn:
    id: location-locate
- extendedWaitUntil:
    notVisible:
      id: location-locating
    timeout: 300000
- scrollUntilVisible:
    element:
      id: location-fix
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: location-decimal
- takeScreenshot: e2e/out/tools-01-fix
- scrollUntilVisible:
    element:
      id: location-sms
    direction: DOWN
    timeout: 10000
# Not tapped: it opens the SMS app on the phone's contacts (a stray tap there could send the position).
# The hand-off is checked by hand on the release candidate (docs/release-process.md, step 6).
- assertVisible:
    id: location-sms
    enabled: true
# SOS torch and red screen
- scrollUntilVisible:
    element:
      id: sos-torch-start
    direction: UP
    timeout: 10000
- tapOn:
    id: sos-torch-start
- extendedWaitUntil:
    visible:
      id: sos-torch-running
    timeout: 5000
- takeScreenshot: e2e/out/tools-02-torch
- tapOn:
    id: sos-torch-stop
- assertVisible:
    id: sos-torch-start
- tapOn:
    id: sos-screen-red
- extendedWaitUntil:
    visible:
      id: sos-screen
    timeout: 5000
- takeScreenshot: e2e/out/tools-03-red-screen
- tapOn:
    id: sos-screen
- extendedWaitUntil:
    visible:
      id: tools-screen
    timeout: 5000
# Compass
- scrollUntilVisible:
    element:
      id: compass-start
    direction: DOWN
    timeout: 10000
- tapOn:
    id: compass-start
- scrollUntilVisible:
    element:
      id: compass-heading
    direction: DOWN
    timeout: 15000
- takeScreenshot: e2e/out/tools-04-compass
- tapOn:
    id: compass-stop
